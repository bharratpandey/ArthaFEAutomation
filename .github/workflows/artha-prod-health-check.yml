name: Artha Prod Health Check

on:
  schedule:
    - cron: '30 23 * * 0-4'   # 5:00 AM IST  (Sun–Thu UTC = Mon–Fri IST)
    - cron: '30 11 * * 1-5'   # 5:00 PM IST  (Mon–Fri UTC)
  workflow_dispatch:
    inputs:
      email_to:
        description: 'Override recipient list (comma-separated)'
        required: false
        default: ''
      headless:
        description: 'Run browser headless'
        required: false
        default: 'true'

jobs:
  prod-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 xvfb

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pom.xml') }}
          restore-keys: |
            playwright-browsers-

      - name: Resolve Maven dependencies
        run: mvn dependency:resolve --no-transfer-progress -q

      - name: Install Playwright Chromium
        run: |
          PLAYWRIGHT_JAR=$(find ~/.m2/repository/com/microsoft/playwright/playwright \
            -name "playwright-*.jar" | head -1)
          DRIVER_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver \
            -name "driver-*.jar" | head -1)
          BUNDLE_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver-bundle \
            -name "driver-bundle-*.jar" | head -1)
          java -cp "$PLAYWRIGHT_JAR:$DRIVER_JAR:$BUNDLE_JAR" \
            com.microsoft.playwright.CLI install chromium

      - name: Install Chromium system deps via Playwright CLI
        run: |
          PLAYWRIGHT_JAR=$(find ~/.m2/repository/com/microsoft/playwright/playwright \
            -name "playwright-*.jar" | head -1)
          DRIVER_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver \
            -name "driver-*.jar" | head -1)
          BUNDLE_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver-bundle \
            -name "driver-bundle-*.jar" | head -1)
          sudo java -cp "$PLAYWRIGHT_JAR:$DRIVER_JAR:$BUNDLE_JAR" \
            com.microsoft.playwright.CLI install-deps chromium

      - name: Set email recipient
        id: email
        run: |
          if [ -n "${{ github.event.inputs.email_to }}" ]; then
            echo "to=${{ github.event.inputs.email_to }}" >> $GITHUB_OUTPUT
          else
            echo "to=bharat.pandey@emb.global,saumya.gupta@emb.global,ashish.mishra@emb.global" >> $GITHUB_OUTPUT
          fi

      - name: Run Artha Prod Health Check
        id: run_test
        run: |
          xvfb-run mvn test \
            -Dtest=ProdHealthCheckTest \
            -Dheadless=${{ github.event.inputs.headless || 'true' }} \
            -Demail.to="${{ steps.email.outputs.to }}" \
            --no-transfer-progress
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CI: true

      - name: Upload HTML Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Artha-Prod-Health-Dashboard-${{ github.run_number }}
          path: target/AutomationDashboard.html
          retention-days: 30

      - name: Upload Playwright Trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Artha-Prod-Health-Trace-${{ github.run_number }}
          path: target/artha-prod-health-trace.zip
          retention-days: 14

      - name: Print run summary
        if: always()
        run: |
          echo "## Artha Prod Health Check — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production — artha.emb.global |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Recipients | ${{ steps.email.outputs.to }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trace viewer | https://trace.playwright.dev/ |" >> $GITHUB_STEP_SUMMARY

      # ── Save report + trace to Supabase ──────────────────────────
      - name: Save to Supabase Dashboard
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ steps.run_test.outcome }}" == "success" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi

          TIMESTAMP=$(date +%s)
          REPORT_URL="null"
          TRACES_JSON="[]"

          # Upload HTML report
          REPORT_FILE="target/AutomationDashboard.html"
          if [ -f "$REPORT_FILE" ]; then
            REPORT_NAME="ARTHA_ProdHealthCheck_${TIMESTAMP}.html"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: text/html" \
              -H "x-upsert: true" \
              --data-binary @"${REPORT_FILE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${REPORT_NAME}")
            echo "Report upload HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              REPORT_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${REPORT_NAME}"
              echo "Report URL: $REPORT_URL"
            fi
          fi

          # Upload trace
          TRACE_FILE="target/artha-prod-health-trace.zip"
          if [ -f "$TRACE_FILE" ]; then
            TRACE_NAME="ARTHA_ProdHealthCheck_trace_${TIMESTAMP}.zip"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/zip" \
              -H "x-upsert: true" \
              --data-binary @"${TRACE_FILE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${TRACE_NAME}")
            echo "Trace upload HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              TRACE_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${TRACE_NAME}"
              TRACES_JSON="[{\"name\":\"artha-prod-health-trace.zip\",\"url\":\"${TRACE_URL}\"}]"
              echo "Trace URL: $TRACE_URL"
            fi
          fi

          # Insert row
          curl -s -X POST \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"project\": \"ARTHA\",
              \"report_name\": \"Artha Prod Health Check\",
              \"environment\": \"PROD\",
              \"status\": \"${STATUS}\",
              \"passed\": 0,
              \"failed\": 0,
              \"total\": 0,
              \"duration_seconds\": 0,
              \"report_url\": $([ "$REPORT_URL" = "null" ] && echo "null" || echo "\"${REPORT_URL}\""),
              \"trace_url\": null,
              \"traces\": ${TRACES_JSON}
            }" \
            "${SUPABASE_URL}/rest/v1/test_reports"

          echo "✅ Saved to Supabase dashboard (status: ${STATUS})"