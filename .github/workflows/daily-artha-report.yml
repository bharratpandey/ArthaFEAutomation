name: Daily Artha Automation Report

on:
  schedule:
    # Every weekday (Mon–Fri) at 12:00 PM IST = 6:30 AM UTC
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pom.xml') }}

      - name: Install Playwright Chromium
        run: |
          mvn dependency:resolve --no-transfer-progress
          PLAYWRIGHT_JAR=$(find ~/.m2/repository/com/microsoft/playwright/playwright -name "playwright-*.jar" | head -1)
          DRIVER_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver -name "driver-*.jar" | head -1)
          BUNDLE_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver-bundle -name "driver-bundle-*.jar" | head -1)
          java -cp "$PLAYWRIGHT_JAR:$DRIVER_JAR:$BUNDLE_JAR" com.microsoft.playwright.CLI install chromium

      - name: Install Chromium system deps via Playwright
        run: |
          PLAYWRIGHT_JAR=$(find ~/.m2/repository/com/microsoft/playwright/playwright -name "playwright-*.jar" | head -1)
          DRIVER_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver -name "driver-*.jar" | head -1)
          BUNDLE_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver-bundle -name "driver-bundle-*.jar" | head -1)
          sudo java -cp "$PLAYWRIGHT_JAR:$DRIVER_JAR:$BUNDLE_JAR" com.microsoft.playwright.CLI install-deps chromium

      - name: Run E2E Tests
        id: run_test
        run: xvfb-run mvn test -Dtest=DealTest
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CI: true

      - name: Upload Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Artha-Automation-Dashboard
          path: target/AutomationDashboard.html

      # ── Save report + trace to Supabase ──────────────────────────
      - name: Save to Supabase Dashboard
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ steps.run_test.outcome }}" == "success" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi

          TIMESTAMP=$(date +%s)
          REPORT_URL="null"
          TRACES_JSON="[]"

          # Upload HTML report
          REPORT_FILE="target/AutomationDashboard.html"
          if [ -f "$REPORT_FILE" ]; then
            REPORT_NAME="ARTHA_DailyE2E_${TIMESTAMP}.html"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: text/html" \
              -H "x-upsert: true" \
              --data-binary @"${REPORT_FILE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${REPORT_NAME}")
            echo "Report upload HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              REPORT_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${REPORT_NAME}"
              echo "Report URL: $REPORT_URL"
            fi
          fi

          # Upload trace if exists
          TRACE_FILE="target/artha-daily-trace.zip"
          if [ -f "$TRACE_FILE" ]; then
            TRACE_NAME="ARTHA_DailyE2E_trace_${TIMESTAMP}.zip"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/zip" \
              -H "x-upsert: true" \
              --data-binary @"${TRACE_FILE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${TRACE_NAME}")
            echo "Trace upload HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              TRACE_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${TRACE_NAME}"
              TRACES_JSON="[{\"name\":\"artha-daily-trace.zip\",\"url\":\"${TRACE_URL}\"}]"
            fi
          fi

          # Insert row
          curl -s -X POST \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"project\": \"ARTHA\",
              \"report_name\": \"Artha Daily E2E\",
              \"environment\": \"UAT\",
              \"status\": \"${STATUS}\",
              \"passed\": 0,
              \"failed\": 0,
              \"total\": 0,
              \"duration_seconds\": 0,
              \"report_url\": $([ "$REPORT_URL" = "null" ] && echo "null" || echo "\"${REPORT_URL}\""),
              \"trace_url\": null,
              \"traces\": ${TRACES_JSON}
            }" \
            "${SUPABASE_URL}/rest/v1/test_reports"

          echo "✅ Saved to Supabase dashboard (status: ${STATUS})"